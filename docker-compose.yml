version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vibemusic-postgres
    environment:
      POSTGRES_DB: vibemusic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: